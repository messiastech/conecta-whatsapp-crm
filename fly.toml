# =======================================================
# Fly.io Blueprint (fly.toml) — Contingência Secundária
# NOTA: Railway/Docker é o ambiente de produção principal.
# =======================================================

app = "yeshua-desk-igrejas"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma db push --skip-generate && npm run init:prod"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  VERTICAL_PROFILE = "ACCOUNTING"
  ALLOW_PUBLIC_SIGNUP = "false"
  BRAND_NAME = "YESHUA DESK IGREJAS"
  BRAND_SUBTITLE = "Contabilidade Especializada para Igrejas e Terceiro Setor"
  WHATSAPP_PROVIDER = "gpn"
  YESHUA_ADMIN_EMAIL = "admin@yeshuacontabilidade.com.br"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
