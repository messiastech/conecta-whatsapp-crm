# =======================================================
# Render Blueprint (render.yaml) — Yeshua Cloud Demo
# Plano Zero-Cost (Hobby/Free) com Release Automatizado
# =======================================================

services:
  - type: web
    name: yeshua-cloud-demo
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npx prisma generate && npm run build
    # preDeployCommand executa migrações/push e seed antes do tráfego ser roteado (planos pagos)
    preDeployCommand: npm run release:yeshua
    # startCommand garante migrações e seed mesmo no plano gratuito do Render
    startCommand: npm run start:yeshua-release
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VERTICAL_PROFILE
        value: ACCOUNTING
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"
      - key: BRAND_NAME
        value: YESHUA AI CLIENT DESK
      - key: BRAND_SUBTITLE
        value: powered by MEGA CORE
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: YESHUA_DEMO_EMAIL
        value: demo@yeshuacontabilidade.com.br
      - key: YESHUA_DEMO_PASSWORD
        sync: false
