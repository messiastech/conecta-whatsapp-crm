# =======================================================
# Render Blueprint (render.yaml) — Contingência Secundária
# NOTA: Railway/Docker é o ambiente de produção principal.
# =======================================================

services:
  - type: web
    name: yeshua-desk-igrejas
    env: node
    plan: standard
    region: ohio
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npm run release:prod
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VERTICAL_PROFILE
        value: ACCOUNTING
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"
      - key: BRAND_NAME
        value: YESHUA DESK IGREJAS
      - key: BRAND_SUBTITLE
        value: Contabilidade Especializada para Igrejas e Terceiro Setor
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WHATSAPP_PROVIDER
        value: gpn
      - key: GPN_API_URL
        sync: false
      - key: GPN_API_KEY
        sync: false
      - key: GPN_WEBHOOK_SECRET
        sync: false
      - key: YESHUA_ADMIN_EMAIL
        value: admin@yeshuacontabilidade.com.br
      - key: YESHUA_ADMIN_PASSWORD
        sync: false
