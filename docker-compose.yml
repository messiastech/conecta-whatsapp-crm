version: '3.8'

services:
  yeshua-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeshua-ai-client-desk
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - VERTICAL_PROFILE=ACCOUNTING
      - ALLOW_PUBLIC_SIGNUP=false
      - BRAND_NAME=YESHUA AI CLIENT DESK
      - BRAND_SUBTITLE=powered by MEGA CORE
      - YESHUA_DEMO_EMAIL=demo@yeshuacontabilidade.com.br
      - YESHUA_DEMO_PASSWORD=${YESHUA_DEMO_PASSWORD:-Yeshua2026!Demo}
      - WHATSAPP_PROVIDER=mock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
